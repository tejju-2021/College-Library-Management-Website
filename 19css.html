<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Design Example</title>

<style>
    body {
        background-image: url('https://imgs.search.brave.com/t_IU3_Y7HA5tU5jTcajG0_XE-DBNbVjdkuJmWvk8h-Y/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJhY2Nlc3Mu/Y29tL2Z1bGwvMzM4/NTQzLmpwZw');
        background-size: cover;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #222;
    }
    h1 {
        text-align: center;
        font-family: "Georgia", serif;
        font-size: 40px;
        color: darkblue;
        text-decoration: underline;
        padding-top: 20px;
    }
    .content-box {
        background-image: url('https://imgs.search.brave.com/AjQvaAkLvQCM4yTUORvsX-JHOmqjBA_K__UGv0XewDU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJhY2Nlc3Mu/Y29tL2Z1bGwvODI3/MDY0LmpwZw');
        background-size: cover;
        width: 70%;
        margin: 30px auto;
        padding: 20px;
        border: 3px solid black;
        border-radius: 15px;
        font-weight: bold;
        font-size: 20px;
        color: #fff;
    }
    p {
        font-style: italic;
    }
    .highlight {
        font-family: "Courier New", monospace;
        font-size: 22px;
        color: yellow;
        background: rgba(0, 0, 0, 0.6);
        padding: 5px;
    }

</style>
</head>
<body>
    <h1>Welcome to CSS Styling</h1>
    <div class="content-box">
        <p>This web page demonstrates the use of different fonts, styles, and background images using CSS.</p>
        <p class="highlight">This text has a different font and style applied using a selector.</p>
    </div>
</body>
</html>
