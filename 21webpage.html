<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
    body {
        background: #f6e7ff;
        color: #444;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container {
        background: #ffffff;
        padding: 25px;
        border-radius: 15px;
        width: 360px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        text-align: center;
        border: 2px solid #e3c6ff;
    }
    h2 {
        color: #7b4ca0;
    }
    input {
        width: 65%;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #d9b3ff;
        background: #fbf7ff;
    }
    button {
        padding: 10px 14px;
        border: none;
        background: #9364da;
        color: #fff;
        cursor: pointer;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }
    button:hover {
        background: #b48cff;
    }
    ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
    }
    li {
        background: #fff5ff;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 6px solid #e5c9ff;
        font-size: 16px;
    }
    li.done {
        text-decoration: line-through;
        color: #e58383;
        background: #f2ebff;
    }
    .deleteBtn {
        background: #ffb5c8; /* Soft pink */
        border: none;
        color: white;
        padding: 5px 9px;
        cursor: pointer;
        border-radius: 50%;
        font-weight: bold;
    }
    .deleteBtn:hover {
        background: #ff94ad;
    }
</style>
</head>
<body>
<div class="container">
    <h2>📝 To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
</div>
<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let taskText = input.value.trim();
    if (taskText === "") {
        alert("Please enter a task!");
        return;
    }
    let li = document.createElement("li");
    li.innerHTML = `
        <span onclick="toggleTask(this)">${taskText}</span>
        <button class="deleteBtn" onclick="deleteTask(this)">✕</button>
    `;
    document.getElementById("taskList").appendChild(li);
    input.value = "";
}
function toggleTask(item) {
    item.parentElement.classList.toggle("done");
}
function deleteTask(btn) {
    btn.parentElement.remove();
}
</script>
</body>
</html>
